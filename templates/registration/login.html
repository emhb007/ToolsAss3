{% extends 'base.html' %}

{% load static %}

{% block title %}Log In - School Trip Tracker 2026{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <img src="{% static 'images/school-trip-tracker-logo-placeholder.svg' %}" alt="School Trip Tracker 2026 logo placeholder" class="img-fluid d-block mx-auto mb-4" style="width: 320px; height: 120px;">
                <h1 class="h3 mb-4">Log In</h1>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Your username and password did not match. Please try again.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
